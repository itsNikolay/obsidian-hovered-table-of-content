name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: virustotal-public-api
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const m=require("./manifest.json"); if(process.env.RELEASE_TAG!==m.version) { console.error("Tag " + process.env.RELEASE_TAG + " does not match manifest version " + m.version); process.exit(1); }'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # End-to-end tests against the real Linux Obsidian app in Docker.
      - run: npm run docker:e2e
      - run: npm run build
      - name: Scan release files with VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: npm run scan:virustotal
      - name: Preserve VirusTotal report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-report
          path: artifacts/virustotal/
          if-no-files-found: warn
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" main.js manifest.json styles.css --notes-file artifacts/virustotal/virustotal-report.md --generate-notes --title "Hovered Table of Content $RELEASE_TAG"
