name: CI

on:
  push:
  pull_request:

# A newer push replaces obsolete checks on the same branch; releases are unaffected.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Builds the Docker image with the Linux Obsidian app and runs the end-to-end tests in a synthetic vault.
      - run: npm run docker:e2e
      - name: Preserve end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: artifacts/docker/
          if-no-files-found: warn
